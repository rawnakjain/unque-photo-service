[project]
name = "service-testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rawnakjain", email = "raunakpugalia27@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.18.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.18",
    "sentence-transformers>=3.3.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
service-testing = "service_testing:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
